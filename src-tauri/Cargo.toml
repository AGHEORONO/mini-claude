[package]
name = "mini-claude"
version = "0.1.0"
description = "Mini Claude desktop pet"
authors = ["Taian Adrian"]
edition = "2021"

[lib]
name = "mini_claude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
notify = "6"
winreg = "0.52"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
